<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>イベント申込</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 16px; color: #222; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    label { display: block; margin-bottom: 14px; font-size: 14px; }
    input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; }
    .req::after { content: " *"; color: #c00; }
    button { width: 100%; padding: 14px; font-size: 16px; border: 0; border-radius: 8px; background: #06c755; color: #fff; }
    button:disabled { background: #9bd9b3; }
    #message { margin-top: 12px; min-height: 1.5em; font-size: 14px; }
    #message.error { color: #c00; }
    #message.ok { color: #067d34; }
  </style>
</head>
<body>
  <h2>イベント申込</h2>
  <p id="evtinfo" style="font-size:12px;color:#888;margin:-8px 0 12px;"></p>

  <div id="evcard" style="display:none;border:1px solid #ddd;border-radius:10px;padding:12px;margin:0 0 16px;">
    <img id="flyer" alt="チラシ" style="display:none;width:100%;border-radius:6px;margin:0 0 10px;">
    <div id="evtitle" style="font-size:18px;font-weight:bold;margin:0 0 8px;"></div>
    <div id="evmeta" style="font-size:14px;line-height:1.7;"></div>
    <div id="evdetail" style="font-size:14px;line-height:1.6;white-space:pre-wrap;margin-top:8px;color:#444;"></div>
    <div id="evvideo" style="display:none;margin-top:12px;">
      <div id="evvideoframe" style="display:none;position:relative;width:100%;padding-top:56.25%;margin-bottom:8px;">
        <iframe id="evvideoif" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:6px;" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="紹介動画"></iframe>
      </div>
      <a id="evvideolink" href="#" style="display:block;text-align:center;padding:10px;border:1px solid #2e7d5b;border-radius:8px;color:#2e7d5b;font-size:14px;text-decoration:none;">▶ 動画を見る</a>
    </div>
  </div>

  <form id="form" novalidate>
    <label><span class="req">氏名</span> <input type="text" id="name" autocomplete="name"></label>
    <label>フリガナ <input type="text" id="kana"></label>
    <label>電話番号 <input type="tel" id="phone" autocomplete="tel"></label>
    <label>メール <input type="email" id="email" autocomplete="email"></label>
    <label><span class="req">参加人数</span> <input type="number" id="party_size" value="1" min="1" max="20"></label>
    <label>備考 <input type="text" id="note"></label>
    <p style="font-size:12px;color:#666;margin:0 0 12px;">電話番号またはメールのどちらかは必ず入力してください。</p>
    <p style="font-size:12px;color:#444;background:#f6f6f6;border-radius:6px;padding:8px;margin:0 0 12px;line-height:1.6;">入力いただいた申込情報は、このイベントの主催団体に提供します。主催団体は、イベントの運営と、連絡のためにだけ使います。「申し込む」を押すと、これに同意したものとします。<br>詳しくは、<a href="https://isespst-lgtm.github.io/line-event-miniapp/privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>をご覧ください。</p>

    <fieldset style="border:1px solid #ddd;border-radius:8px;margin:0 0 14px;padding:10px 12px;">
      <legend style="font-size:13px;padding:0 4px;">新着イベントのお知らせ（任意）</legend>
      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;">
        <input type="checkbox" id="consent" style="width:auto;margin-top:3px;">
        <span>新しく登録されたイベントの情報を、LINEで受け取る（いつでも停止できます）</span>
      </label>
      <div id="scopebox" style="display:none;font-size:14px;margin:0 0 4px 26px;">
        <p style="font-size:12px;color:#666;margin:0 0 6px;">受け取る範囲</p>
        <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;">
          <input type="radio" name="scope" value="all" checked style="width:auto;margin-top:3px;">
          <span>すべての団体の新着イベント</span>
        </label>
        <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:0;">
          <input type="radio" name="scope" value="org" style="width:auto;margin-top:3px;">
          <span>このイベントの主催団体の新着イベントだけ</span>
        </label>
      </div>
    </fieldset>
    <button type="submit" id="submitBtn" disabled>申し込む</button>
  </form>
  <p id="message"></p>
  <p id="tosettingsrow" style="display:none;text-align:center;font-size:13px;margin-top:18px;"><a href="#" id="tolist">公開中のイベント一覧</a>　｜　<a href="#" id="tosettings">新着イベントの配信の設定・停止</a></p>

  <div id="evlist" style="display:none;">
    <h2>公開中のイベント</h2>
    <p id="evlistmsg" style="font-size:14px;color:#444;"></p>
    <div id="evlistbody"></div>
    <p style="text-align:center;font-size:13px;margin-top:18px;"><a href="#" id="evlist_settings">新着イベントの配信の設定・停止</a></p>
  </div>

  <div id="settings" style="display:none;">
    <h2>新着イベントの配信設定</h2>
    <p id="s_status" style="font-size:13px;color:#444;margin:0 0 12px;"></p>
    <fieldset style="border:1px solid #ddd;border-radius:8px;margin:0 0 14px;padding:10px 12px;">
      <legend style="font-size:13px;padding:0 4px;">受け取る範囲</legend>
      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;">
        <input type="radio" name="smode" value="all" style="width:auto;margin-top:3px;"><span>すべての団体の新着イベントを受け取る</span>
      </label>
      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;">
        <input type="radio" name="smode" value="org" style="width:auto;margin-top:3px;"><span>選んだ団体の新着イベントだけ受け取る</span>
      </label>
      <div id="s_orgs" style="margin:0 0 10px 26px;font-size:14px;"></div>
      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:0;">
        <input type="radio" name="smode" value="off" style="width:auto;margin-top:3px;"><span>受け取らない（配信を停止する）</span>
      </label>
    </fieldset>
    <button type="button" id="s_save">保存する</button>
    <p id="s_msg" style="margin-top:12px;min-height:1.5em;font-size:14px;"></p>
    <p id="s_back" style="display:none;text-align:center;font-size:13px;"><a href="#" id="s_backlink">イベントの申込に戻る</a></p>
  </div>

  <script>
    // Make のWebhook URL（公開されても、LINEのIDトークン検証を通らない送信は受け付けません）
    const WEBHOOK_URL = "https://hook.eu1.make.com/tt9sc38qgryqwpi377x18cw38jis13l4";

    // イベント情報の取得先（申込受付のGASのWebアプリのURL。公開してよい情報だけを返す）
    const INFO_URL = "https://script.google.com/macros/s/AKfycbyTZuvCGjji9yys3OoMYIYJt49GeAcNE3Pn0j5_OZfB3HNYQc6_qBJ7-KdMWzZM7NPqiA/exec";

    // ★ LINE Developers コンソール［ウェブアプリ設定］タブの LIFF ID を入れる
    //   （開発中は「開発用」内部チャネルのLIFF ID）
    const LIFF_ID = "2012666624-U4bc3Mu9";

    let idToken = null;
    let eventId = "";
    let orgId = "";
    let submitting = false;

    // true にすると、エラー時に受信したURLのパラメータを画面に表示する（調査用。通常は false）
    const DEBUG = false;

    const $ = (id) => document.getElementById(id);

    function readEventParams() {
      const params = new URLSearchParams(location.search);
      let ev = params.get("event_id") || "";
      let og = params.get("org_id") || "";
      // LINEのログイン処理などで、パラメータが liff.state に入って届く場合に備える
      const state = params.get("liff.state");
      if ((!ev || !og) && state) {
        const i = state.indexOf("?");
        const inner = new URLSearchParams(i >= 0 ? state.slice(i + 1) : state);
        ev = ev || inner.get("event_id") || "";
        og = og || inner.get("org_id") || "";
      }
      let pg = params.get("page") || "";
      if (!pg && state) {
        const j = state.indexOf("?");
        pg = new URLSearchParams(j >= 0 ? state.slice(j + 1) : state).get("page") || "";
      }
      return { eventId: ev, orgId: og, page: pg };
    }

    function show(text, kind) {
      const el = $("message");
      el.textContent = text;
      el.className = kind || "";
    }

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        // 外部ブラウザで開かれた場合はLINEログインへ
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        idToken = liff.getIDToken();
        if (!idToken) {
          show("LINEログイン情報を取得できませんでした。ミニアプリを開き直してください。", "error");
          return;
        }

        // イベント・団体は URL パラメータで指定: ...?event_id=evt_001&org_id=org_001
        const found = readEventParams();
        eventId = found.eventId;
        orgId = found.orgId;
        if (found.page === "settings") {
          openSettings(false);
          return;
        }
        if (found.page === "events") {
          openEventList();
          return;
        }
        if (!/^evt_\d+$/.test(eventId) || !/^org_\d+$/.test(orgId)) {
          show("イベントの指定が正しくありません。案内のリンクからもう一度開いてください。" +
               (DEBUG ? "（受信したURLの条件: " + (location.search || "なし") + "）" : ""), "error");
          return;
        }

        $("evtinfo").textContent = "イベントID: " + eventId;
        $("tosettingsrow").style.display = "block";

        // イベントの内容を表示する（取得できなくても、申込自体はできる。サーバー側でも確認する）
        const closedForm = await loadEventInfo();
        if (closedForm) return;
        $("submitBtn").disabled = false;
      } catch (e) {
        console.error(e);
        show("LINEとの連携の初期化に失敗しました。時間をおいて開き直してください。", "error");
      }
    }

    // イベント情報を表示する。申込を受け付けない状態なら、フォームを隠して true を返す
    async function loadEventInfo() {
      try {
        const res = await fetch(INFO_URL + "?event_id=" + encodeURIComponent(eventId) + "&org_id=" + encodeURIComponent(orgId));
        const data = await res.json();
        if (!data.ok) {
          if (data.error === "not_found") {
            $("form").style.display = "none";
            show("このイベントは見つかりません（または受付していません）。", "error");
            return true;
          }
          return false;
        }
        const ev = data.event;
        $("evtitle").textContent = ev.title;
        const lines = [];
        if (ev.date) lines.push("日時：" + ev.date.replace(/-/g, "/") + (ev.time ? " " + ev.time : ""));
        if (ev.place) lines.push("場所：" + ev.place);
        if (ev.capacity > 0) lines.push("定員：" + ev.capacity + "名（残り " + ev.remaining + "名）");
        if (ev.deadline) lines.push("申込締切：" + ev.deadline.replace(/-/g, "/"));
        $("evmeta").textContent = lines.join("\n");
        $("evmeta").style.whiteSpace = "pre-line";
        $("evdetail").textContent = ev.detail || "";
        if (ev.flyer && /^https:\/\//.test(ev.flyer)) {
          const img = $("flyer");
          img.onerror = () => { img.style.display = "none"; };
          img.onload = () => { img.style.display = "block"; };
          img.onclick = () => { try { liff.openWindow({ url: ev.flyer, external: true }); } catch (_) {} };
          img.src = ev.flyer;
        }
        if (ev.video && /^https:\/\//.test(ev.video.url)) {
          if (ev.video.embed && /^https:\/\/(www\.youtube-nocookie\.com|player\.vimeo\.com)\//.test(ev.video.embed)) {
            $("evvideoif").src = ev.video.embed;
            $("evvideoframe").style.display = "block";
          }
          $("evvideolink").onclick = (e) => { e.preventDefault(); try { liff.openWindow({ url: ev.video.url, external: true }); } catch (_) { window.open(ev.video.url, "_blank"); } };
          $("evvideo").style.display = "block";
        }
        $("evcard").style.display = "block";

        if (ev.state === "closed" || ev.state === "full") {
          $("form").style.display = "none";
          show(ev.state === "closed" ? "申込の受付期間が終了しました。" : "定員に達したため、受付を終了しました。", "error");
          return true;
        }
      } catch (e) {
        console.error(e); // 表示に失敗しても、申込フォームは使えるようにしておく
      }
      return false;
    }

    function validate(v) {
      if (!v.name) return "氏名を入力してください";
      if (!v.phone && !v.email) return "電話番号またはメールを入力してください";
      if (v.phone && !/^[0-9０-９+\-ー\s]{8,20}$/.test(v.phone)) return "電話番号の形式を確認してください";
      if (v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) return "メールアドレスの形式を確認してください";
      if (!Number.isInteger(v.party_size) || v.party_size < 1 || v.party_size > 20) return "参加人数は1〜20で入力してください";
      return "";
    }

    $("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (submitting || !idToken) return;

      const values = {
        name: $("name").value.trim(),
        kana: $("kana").value.trim(),
        phone: $("phone").value.trim(),
        email: $("email").value.trim(),
        party_size: Number($("party_size").value),
        note: $("note").value.trim()
      };
      const consent = $("consent").checked;
      const scopeEl = document.querySelector('input[name="scope"]:checked');
      const scope = consent && scopeEl ? scopeEl.value : "";

      const err = validate(values);
      if (err) {
        show(err, "error");
        return;
      }

      // ステータスは送らない（Make側で「申込済」を付ける）
      const body = new URLSearchParams({
        id_token: idToken,
        event_id: eventId,
        org_id: orgId,
        name: values.name,
        kana: values.kana,
        phone: values.phone,
        email: values.email,
        party_size: String(values.party_size),
        note: values.note,
        consent: consent ? "1" : "0",
        scope: scope
      });

      submitting = true;
      $("submitBtn").disabled = true;
      show("送信中...");

      try {
        // フォーム形式で送る（CORSのプリフライトが発生しない）
        const res = await fetch(WEBHOOK_URL, { method: "POST", body: body });

        if (res.ok) {
          show("申込が完了しました" + (consent ? "。新着イベントのお知らせを登録しました。" : ""), "ok");
          if (consent) {
            // 公式アカウントを友だち追加していない場合に、追加を案内する
            try { await liff.requestFriendship(); } catch (_) {}
          }
          return; // 二重申込を防ぐため、ボタンは無効のまま
        }
        if (res.status === 401) {
          show("ログインの有効期限が切れました。ミニアプリを開き直してからもう一度お試しください。", "error");
        } else if (res.status === 409) {
          let data = {};
          try { data = await res.json(); } catch (_) {}
          const rem = parseInt(data.remaining, 10);
          const msgs = {
            duplicate: "このイベントには、すでに申込済みです。",
            full: Number.isFinite(rem) && rem > 0
              ? "定員を超えるため申し込めません。残りは " + rem + " 名です。人数を減らして、もう一度お試しください。"
              : "定員に達したため、受付を終了しました。",
            closed: "申込の受付期間が終了しました。",
            not_found: "このイベントは見つかりません（または受付していません）。",
            invalid: "入力内容を確認してください。",
            busy: "混み合っています。少し待って、もう一度お試しください。"
          };
          show(msgs[data.error] || "申込を受け付けられませんでした。時間をおいてもう一度お試しください。", "error");
          if (data.error === "duplicate" || data.error === "closed" || data.error === "not_found" ||
              (data.error === "full" && !(rem > 0))) {
            return; // 再送しても通らないので、ボタンは無効のまま
          }
        } else {
          show("送信に失敗しました。時間をおいてもう一度お試しください。", "error");
        }
      } catch (e) {
        console.error(e);
        show("通信エラーが発生しました。申込が届いたか不明な場合は、主催者にご確認ください。", "error");
      }

      submitting = false;
      $("submitBtn").disabled = false;
    });

    // ===== 配信の設定（受け取る範囲の変更・停止） =====
    function sShow(text, kind) {
      const el = $("s_msg");
      el.textContent = text;
      el.style.color = kind === "error" ? "#c00" : kind === "ok" ? "#067d34" : "#222";
    }

    async function settingsPost(fields) {
      const body = new URLSearchParams(Object.assign({ id_token: idToken }, fields));
      const res = await fetch(INFO_URL, { method: "POST", body: body });
      return res.json();
    }

    function renderOrgBoxes(orgs) {
      const box = $("s_orgs");
      box.textContent = "";
      if (!orgs.length) {
        const t = document.createElement("div");
        t.style.cssText = "font-size:12px;color:#666;";
        t.textContent = "選べる団体は、イベントに申し込むと、ここに出ます。";
        box.appendChild(t);
        return;
      }
      orgs.forEach((o) => {
        const lab = document.createElement("label");
        lab.style.cssText = "display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;";
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.value = o.id; cb.checked = !!o.selected; cb.style.cssText = "width:auto;margin-top:3px;";
        const sp = document.createElement("span");
        sp.textContent = o.name;
        lab.appendChild(cb); lab.appendChild(sp);
        box.appendChild(lab);
      });
    }

    // 公開中のイベント一覧（リッチメニューから開く: ...?page=events）
    async function openEventList() {
      $("form").style.display = "none";
      $("evcard").style.display = "none";
      $("evtinfo").style.display = "none";
      $("tosettingsrow").style.display = "none";
      $("message").textContent = "";
      document.querySelector("h2").style.display = "none";
      $("evlist").style.display = "block";
      $("evlistmsg").textContent = "読み込み中...";
      try {
        const res = await fetch(INFO_URL + "?list=1");
        const d = await res.json();
        if (!d.ok) { $("evlistmsg").textContent = "読み込めませんでした。時間をおいて、開き直してください。"; return; }
        if (!d.events.length) { $("evlistmsg").textContent = "いま、公開中のイベントはありません。"; return; }
        $("evlistmsg").textContent = "気になるイベントを選ぶと、くわしい内容と、お申し込みの画面が開きます。";
        const body = $("evlistbody");
        body.textContent = "";
        d.events.forEach((ev) => {
          const a = document.createElement("a");
          a.href = "#";
          a.style.cssText = "display:block;border:1px solid #ddd;border-radius:10px;padding:12px;margin:0 0 10px;text-decoration:none;color:inherit;";
          const t = document.createElement("div");
          t.style.cssText = "font-size:16px;font-weight:bold;margin:0 0 6px;";
          t.textContent = ev.title;
          const m = document.createElement("div");
          m.style.cssText = "font-size:13px;line-height:1.6;color:#444;";
          const lines = ["日時：" + ev.date.replace(/-/g, "/") + (ev.time ? " " + ev.time : ""), "場所：" + ev.place, "主催：" + ev.org_name];
          if (ev.state === "full") lines.push("定員に達しました");
          else if (ev.remaining !== null) lines.push("残り " + ev.remaining + "名");
          m.textContent = lines.join("\n");
          m.style.whiteSpace = "pre-line";
          a.appendChild(t); a.appendChild(m);
          a.addEventListener("click", (e) => {
            e.preventDefault();
            location.search = "?event_id=" + encodeURIComponent(ev.id) + "&org_id=" + encodeURIComponent(ev.org_id);
          });
          body.appendChild(a);
        });
      } catch (e) {
        console.error(e);
        $("evlistmsg").textContent = "読み込めませんでした。時間をおいて、開き直してください。";
      }
    }

    async function openSettings(fromEvent) {
      $("form").style.display = "none";
      $("evcard").style.display = "none";
      $("evtinfo").style.display = "none";
      $("tosettingsrow").style.display = "none";
      $("message").textContent = "";
      document.querySelector("h2").style.display = "none";
      $("settings").style.display = "block";
      $("s_back").style.display = fromEvent ? "block" : "none";
      $("s_save").disabled = true;
      sShow("読み込み中...");
      try {
        const d = await settingsPost({ action: "sub_get", org_id: orgId });
        if (!d.ok) { sShow(d.error === "unauthorized" ? "ログインの有効期限が切れました。ミニアプリを開き直してください。" : "読み込めませんでした。", "error"); return; }
        $("s_status").textContent = d.registered
          ? "現在の設定：" + (d.mode === "all" ? "すべての団体の新着イベントを受け取る" : d.mode === "org" ? "選んだ団体の新着イベントだけ受け取る" : "受け取らない")
          : "現在は、新着イベントの配信を希望していません。";
        document.querySelector('input[name="smode"][value="' + d.mode + '"]').checked = true;
        renderOrgBoxes(d.orgs);
        sShow("");
        $("s_save").disabled = false;
      } catch (e) {
        console.error(e);
        sShow("通信に失敗しました。時間をおいて開き直してください。", "error");
      }
    }

    $("tosettings").addEventListener("click", (e) => { e.preventDefault(); openSettings(true); });
    $("tolist").addEventListener("click", (e) => { e.preventDefault(); location.search = "?page=events"; });
    $("evlist_settings").addEventListener("click", (e) => { e.preventDefault(); $("evlist").style.display = "none"; openSettings(false); });
    $("s_backlink").addEventListener("click", (e) => { e.preventDefault(); location.reload(); });

    $("s_save").addEventListener("click", async () => {
      const mode = (document.querySelector('input[name="smode"]:checked') || {}).value;
      if (!mode) { sShow("受け取る範囲を選んでください。", "error"); return; }
      const ids = Array.from(document.querySelectorAll("#s_orgs input:checked")).map((c) => c.value);
      if (mode === "org" && ids.length === 0) { sShow("団体を、1つ以上選んでください。", "error"); return; }
      $("s_save").disabled = true;
      sShow("保存中...");
      try {
        const d = await settingsPost({ action: "sub_set", mode: mode, org_ids: ids.join(",") });
        if (d.ok) {
          sShow("保存しました。", "ok");
          $("s_status").textContent = "現在の設定：" + (mode === "all" ? "すべての団体の新着イベントを受け取る" : mode === "org" ? "選んだ団体の新着イベントだけ受け取る" : "受け取らない");
          if (mode !== "off") { try { await liff.requestFriendship(); } catch (_) {} }
        } else {
          sShow(d.error === "unauthorized" ? "ログインの有効期限が切れました。ミニアプリを開き直してください。" : "保存できませんでした。時間をおいてもう一度お試しください。", "error");
        }
      } catch (e) {
        console.error(e);
        sShow("通信に失敗しました。", "error");
      }
      $("s_save").disabled = false;
    });

    $("consent").addEventListener("change", () => {
      $("scopebox").style.display = $("consent").checked ? "block" : "none";
    });

    initLiff();
  </script>
</body>
</html>
