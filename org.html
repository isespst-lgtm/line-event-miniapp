<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>団体ホーム｜おいない</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; background: #f4f6f4; color: #222; }
  header { background: #2e7d5b; color: #fff; padding: 14px 16px; font-size: 18px; font-weight: bold; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  input[type=password], input[type=text], input[type=email], input[type=date], input[type=number], textarea {
    width: 100%; box-sizing: border-box; padding: 9px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; font-family: inherit; }
  textarea { min-height: 90px; }
  label.f { display: block; font-size: 13px; color: #444; margin: 10px 0 2px; }
  button { background: #2e7d5b; color: #fff; border: 0; border-radius: 6px; padding: 10px 16px; font-size: 15px; cursor: pointer; margin: 2px 0; }
  button.sub { background: #fff; color: #2e7d5b; border: 1px solid #2e7d5b; }
  button.warn { background: #fff; color: #b00020; border: 1px solid #b00020; }
  button.mini { padding: 4px 8px; font-size: 12px; }
  button:disabled { opacity: .5; }
  .err { color: #b00020; margin-top: 8px; }
  .ok { color: #1b5e20; margin-top: 8px; }
  .muted { color: #666; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e0e0e0; }
  .tag.pub { background: #c8e6c9; } .tag.wait { background: #ffe0b2; } .tag.stop { background: #ddd; color: #555; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { border-bottom: 1px solid #eee; padding: 6px 4px; text-align: left; vertical-align: top; word-break: break-all; }
  tr.canceled td { color: #999; text-decoration: line-through; }
  tr.canceled td.act { text-decoration: none; }
  .scroll { overflow-x: auto; }
  .notice { font-size: 12px; color: #8a4b00; background: #fff6e5; border-radius: 6px; padding: 8px; margin-top: 10px; line-height: 1.6; }
  .chk { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 2px; font-size: 14px; }
  .chk input { margin-top: 3px; }
  .panel { border-top: 1px solid #eee; margin-top: 12px; padding-top: 4px; }
  .bk { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; }
  .panel.modal { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(94vw, 640px); max-height: 88vh; overflow-y: auto;
    box-sizing: border-box; background: #fff; border: 3px solid #2e7d5b; border-radius: 12px; padding: 0 16px 14px; margin: 0; }
  .panel.modal.edit { border-color: #1565c0; } .panel.modal.cx { border-color: #b00020; } .panel.modal.set { border-color: #555; }
  .mhead { position: sticky; top: 0; z-index: 1; margin: 0 -16px 8px; padding: 10px 16px; background: #2e7d5b; color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .edit .mhead { background: #1565c0; } .cx .mhead { background: #b00020; } .set .mhead { background: #555; }
  .mhead button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.7); padding: 2px 10px; font-size: 14px; margin: 0; }
  .mfoot { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  button.cancel { background: #fff; color: #555; border: 1px solid #999; }
  .linkrow { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; }
  .linkrow input { font-size: 12px; padding: 5px; }
  .btns { margin-top: 8px; }
</style>
</head>
<body>
<header>団体ホーム（おいない）</header>
<main>
  <div id="login" class="card">
    <p>登録団体の方は、登録のお知らせメールに書かれた「登録コード」を入力してください。</p>
    <form id="loginform" autocomplete="on">
      <input type="text" name="username" value="おいない登録団体" autocomplete="username" readonly tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <input id="code" name="password" type="password" autocomplete="current-password" placeholder="登録コード">
      <p style="margin:6px 0"><label style="font-weight:normal;font-size:13px"><input type="checkbox" id="remember" style="width:auto"> この端末に記憶する（自分専用の端末だけで、選んでください）</label></p>
      <p><button id="go" type="submit">開く</button></p>
    </form>
    <div id="err" class="err"></div>
    <p class="muted">登録コードは、他の方に教えないでください。なくした場合は、事務局（urata@e-ise.net）へご連絡ください。</p>
  </div>
  <div id="home" style="display:none"></div>
</main>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyTZuvCGjji9yys3OoMYIYJt49GeAcNE3Pn0j5_OZfB3HNYQc6_qBJ7-KdMWzZM7NPqiA/exec";
const $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }

let DATA = null;
let CODE = "";      // 画面を閉じるまで、メモリの中に置く（「この端末に記憶する」を選んだときだけ、端末にも保存する）
let COPY = null;    // 「コピーして登録」の、元の内容
const OPEN = {};    // 開いているパネル
const MSG = {};     // 各パネルのメッセージ

const ERR = {
  busy: "しばらくしてから、もう一度お試しください。", unauthorized: "登録コードが違います。", not_found: "見つかりません。",
  server_error: "処理できませんでした。時間をおいて、もう一度お試しください。",
  state: "いまの状態では、この操作はできません。画面を開き直してください。",
  cancelled: "中止したイベントは、修正できません。",
  too_many_pending: "事務局の確認待ちのイベントが、多くなっています。確認が済むまで、お待ちください。",
  duplicate: "同じLINEアカウントの申込がすでにあるため、戻せません。",
  suspended: "この団体の利用は、現在、停止されています。事務局（urata@e-ise.net）へご連絡ください。",
  ai_off: "「チラシで投稿」は、お申し込みの団体のみご利用いただけます。事務局（urata@e-ise.net）へご連絡ください。",
  ai_unavailable: "チラシの読み取りが、いま、利用できません。時間をおいて、お試しいただくか、手で入力して登録してください。",
  not_flyer: "イベントのチラシとして読み取れませんでした。チラシの画像を、選び直してください。",
  flyer_too_big: "画像が大きすぎます。別の画像を選ぶか、写真を撮り直してください。",
  flyer_bad_image: "画像を読み込めませんでした（JPEGまたはPNGの画像を選んでください）。"
};

async function post(action, fields) {
  const body = new URLSearchParams(Object.assign({ action: action, code: CODE }, fields || {}));
  const res = await fetch(API_URL, { method: "POST", body: body });
  return res.json();
}
function errText(d) {
  if (d.error === "invalid" && d.field) return "「" + d.field + "」の入力を、ご確認ください。";
  if (d.error === "flyer_bad" && d.reason) return d.reason;
  if (d.error === "too_soon") return "開催日は、登録する日から " + d.days + " 日以上あとにしてください（LINEの新着配信は、毎週 火曜・金曜に、まとめて送るため、余裕をもって登録してください）。";
  if (d.error === "expired") return "ご契約の期間が終了しています。新しいイベントを登録するには、契約の更新が必要です。事務局（urata@e-ise.net）へご連絡ください。";
  if (d.error === "plan_limit") return "ご契約の投稿数（" + d.limit + "回）に、達しています。続けて登録するには、契約の更新・変更が必要です。事務局（urata@e-ise.net）へご連絡ください。";
  if (d.error === "limit_reached") return "今月に登録できるイベントの数（" + d.limit + "件）に、達しています。増やしたいときは、事務局へご連絡ください。";
  if (d.error === "ai_limit") return "今月の「チラシで投稿」の読み取り回数（" + d.limit + "回）に、達しています。手で入力して登録するか、事務局（urata@e-ise.net）へご連絡ください。";
  if (d.error === "capacity_low") return "すでに " + d.used + " 名の申込があるため、定員を、それより少なくはできません。";
  if (d.error === "full") return "定員を超えるため、戻せません（空きは " + (d.remaining || 0) + " 名です）。";
  if (d.error === "invalid") return "処理できませんでした（入力内容、または、サーバー側の更新が反映されていない可能性があります）。改善しないときは、事務局へご連絡ください。";
  return ERR[d.error] || "処理できませんでした（" + (d.error || "不明") + "）。";
}
function setMsg(k, kind, text) {
  MSG[k] = { kind: kind, text: text };
  const el = $("m_" + k);
  if (el) { el.className = kind; el.textContent = text; }
}
function msgHtml(k) { const m = MSG[k]; return '<div id="m_' + k + '" class="' + (m ? m.kind : "") + '">' + (m ? esc(m.text) : "") + "</div>"; }
function disp(k) { return OPEN[k] ? "block" : "none"; }
function toggle(k) { OPEN[k] = !OPEN[k]; const el = $("p_" + k); if (el) el.style.display = disp(k); }

// 「この端末に記憶する」：チェックしたときだけ、この端末のブラウザに、登録コードを30日間保存する
const REMEMBER_KEY = "oinai_org_code";
const REMEMBER_DAYS = 30;
function rememberGet() {
  try {
    const v = JSON.parse(localStorage.getItem(REMEMBER_KEY) || "null");
    if (v && v.c && v.t && Date.now() - v.t < REMEMBER_DAYS * 86400000) return v.c;
    localStorage.removeItem(REMEMBER_KEY);
  } catch (_) {}
  return "";
}
function rememberSet(c) { try { localStorage.setItem(REMEMBER_KEY, JSON.stringify({ c: c, t: Date.now() })); } catch (_) {} }
function rememberClear() { try { localStorage.removeItem(REMEMBER_KEY); } catch (_) {} }

$("loginform").onsubmit = function (e) { e.preventDefault(); login(); };
async function login(saved) {
  CODE = saved || $("code").value.trim();
  $("err").textContent = "";
  if (!CODE) { $("err").textContent = "登録コードを入力してください"; return; }
  $("go").disabled = true;
  try {
    const d = await post("org_home");
    if (!d.ok) { $("err").textContent = errText(d); if (saved) rememberClear(); CODE = ""; return; }
    DATA = d; $("code").value = "";
    if (!saved) { if ($("remember").checked) rememberSet(CODE); else rememberClear(); }
    render();
  } catch (e) {
    CODE = ""; $("err").textContent = "通信に失敗しました。もう一度お試しください。";
  } finally { $("go").disabled = false; }
}
(function () { const c = rememberGet(); if (c) { $("remember").checked = true; login(c); } })();

async function reload() {
  const d = await post("org_home");
  if (d.ok) { DATA = d; render(); }
}

function statusTag(s) {
  const c = s === "公開" ? "pub" : s === "確認待ち" ? "wait" : (s === "非公開" || s === "中止") ? "stop" : "";
  return '<span class="tag ' + c + '">' + esc(s || "-") + "</span>";
}

// イベントの入力欄（新規・修正で共通）
function evFields(px, e) {
  return '<label class="f">イベント名</label><input type="text" id="' + px + 'title" maxlength="100" value="' + esc(e.title) + '">' +
    '<label class="f">開催日</label><input type="date" id="' + px + 'date" value="' + esc(e.date) + '">' +
    '<label class="f">開催時間（例：10:00-12:00）</label><input type="text" id="' + px + 'time" maxlength="30" value="' + esc(e.time) + '">' +
    '<label class="f">場所</label><input type="text" id="' + px + 'place" maxlength="100" value="' + esc(e.place) + '">' +
    '<label class="f">定員（人）</label><input type="number" id="' + px + 'cap" min="1" max="1000" value="' + esc(e.capacity) + '">' +
    '<label class="f">申込締切（空欄で締切なし）</label><input type="date" id="' + px + 'dl" value="' + esc(e.deadline) + '">' +
    '<label class="f">詳細</label><textarea id="' + px + 'detail" maxlength="2000">' + esc(e.detail) + '</textarea>' +
    '<label class="f">チラシ画像のURL（https:// で始まるもの。空欄でも構いません）</label><input type="text" id="' + px + 'flyer" maxlength="500" value="' + esc(e.flyer) + '" onchange="checkFlyerInput(this)">' +
    '<div class="muted">使える画像：JPEGまたはPNG。Googleドライブの画像は、共有を「リンクを知っている全員」にしてください。PDFや動画は、ここには入れられません。</div>' +
    '<label class="f">動画のURL（YouTubeなど。https:// で始まるもの。空欄でも構いません）</label><input type="text" id="' + px + 'video" maxlength="500" value="' + esc(e.video) + '" onchange="checkVideoInput(this)">' +
    '<div class="muted">申込ページに動画が表示され、LINEのお知らせに「動画を見る」ボタンが付きます。YouTubeは「限定公開」か「公開」にしてください。</div>';
}
// チラシのURLを入れたときに、LINEで使えなさそうなら、すぐに知らせる（登録のときにも、あらためて確認します）
function checkFlyerInput(el) {
  const v = el.value.trim();
  if (!v) return;
  if (!/^https:\/\//.test(v)) { alert("チラシ画像のURLは、https:// で始まるものを入れてください。\n\n画像（JPEGまたはPNG）を、Googleドライブに入れて、共有を「リンクを知っている全員」にして、そのリンクを貼ってください。"); return; }
  if (/\.(pdf|gif|heic|webp|bmp|tiff?)(\?|#|$)/i.test(v)) { alert("チラシは、JPEGまたはPNGの画像だけ、LINEで使えます。\nPDFやGIFなどは、使えません。画像を、JPEGかPNGにして、用意してください。"); return; }
  const m = v.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || v.match(/drive\.google\.com\/.*[?&]id=([\w-]+)/);
  const img = new Image();
  img.onerror = function () { alert("この画像を、読み込めませんでした。\n\n・Googleドライブの共有が「制限付き」になっていませんか？（「リンクを知っている全員」にしてください）\n・JPEGまたはPNGの画像ですか？（PDFなどは使えません）\n・URLは、正しいですか？\n\nこのまま登録しても、画像が使えないときは、登録のときに、お知らせします。"); };
  img.src = m ? "https://lh3.googleusercontent.com/d/" + m[1] + "=w300" : v;
}
// 動画のURLを入れたときに、おかしければ、すぐに知らせる
function checkVideoInput(el) {
  const v = el.value.trim();
  if (!v) return;
  if (!/^https:\/\/\S+$/.test(v)) { alert("動画のURLは、https:// で始まるものを、入れてください。"); return; }
  if (/\.(jpe?g|png|gif)(\?|#|$)/i.test(v)) { alert("これは画像のURLのようです。画像は「チラシ画像のURL」の欄に入れてください。"); }
}
function readEv(px) {
  return { title: $(px + "title").value, date: $(px + "date").value, time: $(px + "time").value, place: $(px + "place").value,
    capacity: $(px + "cap").value, deadline: $(px + "dl").value, detail: $(px + "detail").value, flyer: $(px + "flyer").value, video: $(px + "video").value };
}

function render() {
  const d = DATA, st = d.settings;
  let h = '<div class="bk" style="display:' + (anyModal() ? "block" : "none") + '"></div>' + msgHtml("top") +
    '<div class="card"><div class="row"><div><b>' + esc(d.org.name) + '</b><div class="muted">' + esc(d.org.id) +
    "｜担当：" + esc(d.org.contact) + "｜" + esc(d.org.email) + '</div></div><div><button class="sub" id="setbtn">設定</button> <button class="sub" id="out">閉じる</button></div></div>' +
    '<div id="setpanel" class="panel modal set" style="display:' + disp("set") + '">' +
      '<div class="mhead"><span>設定</span><button data-close="set">× 閉じる</button></div>' +
      '<label class="f">担当者のお名前</label><input type="text" id="s_contact" maxlength="50" value="' + esc(d.org.contact) + '">' +
      '<label class="f">担当者のメールアドレス（登録コードなどのご連絡先）</label><input type="email" id="s_email" maxlength="100" value="' + esc(d.org.email) + '">' +
      '<label class="f">団体の活動分野（' + (d.field_max || 3) + 'つまで。参加者が「この分野の情報だけ受け取る」を選んだとき、配信の対象になります）</label><div id="s_fields">' +
        (d.field_list || []).map(function (f, i) { return '<label style="display:inline-block;margin:2px 14px 2px 0;font-weight:normal"><input type="checkbox" name="s_field" value="' + esc(f) + '"' + ((st.fields || []).indexOf(f) >= 0 ? " checked" : "") + ' style="width:auto"> ' + esc(f) + '</label>'; }).join("") + '</div>' +
      '<div class="chk"><input type="checkbox" id="s_notify"' + (st.notify ? " checked" : "") + '><label for="s_notify">申込があったとき、メールで知らせる（氏名と人数だけをお知らせします）</label></div>' +
      '<label class="f">申込通知の送り先（空欄のときは、上のメールアドレス）</label><input type="email" id="s_to" maxlength="100" value="' + esc(st.notifyTo) + '">' +
      '<div class="chk"><input type="checkbox" id="s_line"' + (st.line ? " checked" : "") + '><label for="s_line">新しく公開されたイベントを、LINEで、配信を希望した方に案内する（毎週 火曜・金曜に、まとめて配信します）</label></div>' +
      '<div class="chk"><input type="checkbox" id="s_flyer"' + (st.flyer ? " checked" : "") + '><label for="s_flyer">LINEの配信に、チラシの画像を付ける（画像を付けても、配信の通数は増えません）</label></div>' +
      '<label class="f">LINEの配信に添える、ひとこと（80文字まで。URLやメールアドレスは入れられません）</label><input type="text" id="s_note" maxlength="80" value="' + esc(st.note) + '">' +
      '<div class="notice" style="background:#f4f8f4;margin-top:10px">' + lineStatsHtml(d) + '</div>' +
      '<div class="muted" style="margin-top:8px">配信の見え方（例）</div><pre id="s_prev" data-org="' + esc(d.org.name) + '" style="background:#f6f6f6;border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;margin:4px 0 0"></pre>' +
      '<div class="mfoot"><button id="s_save">設定を保存</button><button class="cancel" data-close="set">取り消し（閉じる）</button></div>' + msgHtml("set") + '</div>' +
    contractHtml(d) +
    '<div class="notice">申込者の情報は、このイベントの運営のためにだけ使い、ほかの目的に使ったり、第三者に渡したりしないでください。画面や、ダウンロードしたファイルの取り扱いにご注意ください。</div></div>';

  // 事務局からのお知らせ
  h = h.replace(/(<div class="card"><div class="row"><b>)/, function (m) { return noticesHtml(d) + m; });
  if (!(st.fields || []).length) h = h.replace(/(<div class="card"><div class="row"><b>)/, function (m) { return '<div class="notice" style="background:#fff8e1">団体の「活動分野」が、まだ選ばれていません。右上の「設定」で、選んでください（参加者が、分野で配信を選ぶときに使います）。</div>' + m; });

  // 新しいイベントの登録
  const blank = COPY || { title: "", date: "", time: "", place: "", capacity: "", deadline: "", detail: "", flyer: "", video: "" };
  const ai = d.flyer_ai && d.flyer_ai.on;
  h += '<div class="card"><div class="row"><b>イベントを登録する</b><span>' + (ai ? '<button id="aibtn">📷 チラシで投稿</button> ' : "") + '<button id="newbtn">新しいイベントを登録</button></span></div>' +
    (ai ? '<input type="file" id="aifile" accept="image/*" style="display:none"><div class="muted" style="margin-top:6px">「チラシで投稿」：チラシの画像を選ぶと、AIが内容を読み取って、登録の入力欄に入れます。確認して、直してから、登録できます（今月 ' + d.flyer_ai.used + ' / ' + d.flyer_ai.limit + ' 回）。</div>' : "") +
    '<div id="p_new" class="panel modal new" style="display:' + disp("new") + '">' +
    '<div class="mhead"><span>' + (COPY && COPY.ai ? "チラシから登録（内容の確認）" : COPY ? "イベントをコピーして登録" : "新しいイベントを登録") + '</span><button data-close="new">× 閉じる</button></div>' +

  }

  if (a === "saveed") {
    await run(btn, "ed_" + k, async function () {
      const d = await post("org_event", Object.assign({ event_id: k }, readEv("e_" + k + "_")));
      if (!d.ok) { setMsg("ed_" + k, "err", errText(d)); return; }
      OPEN["ed_" + k] = false;
      await reload();
      setMsg("ev_" + k, "ok", d.republish ? "修正を保存しました。事務局が確認したあとに、あらためて公開します。" : "修正を保存しました。");
    });

  }
  if (a === "unpub" || a === "reopen") {
    if (!confirm(a === "unpub" ? "このイベントの公開を止めます。新しい申込は、できなくなります。よろしいですか？" : "このイベントを、公開に戻します。よろしいですか？")) return;
    await run(btn, "ev_" + k, async function () {
      const d = await post("org_event_status", { event_id: k, op: a === "unpub" ? "unpublish" : "reopen" });
      if (!d.ok) { setMsg("ev_" + k, "err", errText(d)); return; }
      await reload();
      setMsg("ev_" + k, "ok", a === "unpub" ? "公開を止めました。" : "公開に戻しました。");
    });
    return;
  }
  if (a === "cxgo") {
    if (!confirm("「" + ev.title + "」を、中止にします。よろしいですか？")) return;
    await run(btn, "cx_" + k, async function () {
      const d = await post("org_event_status", { event_id: k, op: "cancel", notify: $("cxn_" + k).checked ? "1" : "0", message: $("cxm_" + k).value });
      if (!d.ok) { setMsg("cx_" + k, "err", errText(d)); return; }
      OPEN["cx_" + k] = false;

      setMsg("ev_" + k, "ok", "中止にしました。" + (d.notified ? "LINEで、" + d.notified + "名に連絡しました（友だちでない方には、届きません）。" : "") + (d.notify_failed ? "LINEの連絡に失敗しました。個別に、ご連絡ください。" : ""));
    });

  }

    });
  }
}

// 「チラシで投稿」：画像を縮めて（長い辺を1600pxまで）JPEGにし、AIに読み取らせる
function shrinkImage(file) {
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      const max = 1600, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * r)); c.height = Math.max(1, Math.round(img.naturalHeight * r));
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("load")); };
    img.src = url;
  });
}
async function readFlyer(file) {
  const btn = $("aibtn");
  if (file.size > 30 * 1024 * 1024) { setMsg("top", "err", ERR.flyer_too_big); window.scrollTo(0, 0); render(); return; }
  btn.disabled = true;
  setMsg("top", "ok", "チラシを読み取っています…（10〜30秒ほどかかります。画面を閉じずに、お待ちください）");
  const el = $("m_top"); if (el) { el.className = "ok"; el.textContent = MSG.top.text; }
  window.scrollTo(0, 0);
  try {
    const dataUrl = await shrinkImage(file);
    const d = await post("org_flyer_read", { image: dataUrl.split(",")[1], mime: "image/jpeg" });
    if (!d.ok) { setMsg("top", "err", errText(d)); await reload(); return; }
    MSG.top = null;
    COPY = Object.assign({ video: "" }, d.fields, { ai: true, preview: dataUrl });
    if (DATA.flyer_ai) DATA.flyer_ai.used = d.used;
    OPEN["new"] = true;
    render();
  } catch (e) {
    console.error(e);
    setMsg("top", "err", "チラシを読み込めませんでした（JPEGまたはPNGの画像を、選んでください）。時間をおいて、もう一度、お試しください。");
    render();
  } finally {
    if ($("aibtn")) $("aibtn").disabled = false;
  }
}

function csv(i) {
  const ev = DATA.events[i];
  const q = function (s) { s = String(s == null ? "" : s); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const lines = [["氏名", "ふりがな", "人数", "電話", "メール", "備考", "申込日時", "状態"].map(q).join(",")];
  ev.applicants.forEach(function (a) { lines.push([a.name, a.kana, a.party, a.phone, a.email, a.note, a.at, a.status].map(q).join(",")); });
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = ev.id + "_申込者.csv"; a.click();
}
</script>
